<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TUM 学习小助理</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="layout">
    <nav class="sidebar" aria-label="主导航">
      <div class="brand">TUM <span>小助理</span></div>
      <a href="#/" data-nav="plan">今日计划</a>
      <a href="#/focus" data-nav="focus">番茄钟 <span id="nav-timer" class="nav-timer" hidden></span></a>
      <a href="#/stats" data-nav="stats">专注统计</a>
      <a href="#/deadlines" data-nav="deadlines">截止日期</a>
      <a href="#/courses" data-nav="courses">课程</a>
      <a href="#/artemis" data-nav="artemis">Artemis 练习</a>
      <a href="#/grades" data-nav="grades">成绩</a>
      <a href="#/sync" data-nav="sync">同步中心</a>
      <div class="sidebar-foot">
        <div class="mode" role="group" aria-label="显示模式">
          <button type="button" data-mode="light" aria-pressed="false" title="浅色模式"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>浅色</span></button>
          <button type="button" data-mode="dark" aria-pressed="false" title="深色模式"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg><span>深色</span></button>
        </div>
        <div class="note">只在这台电脑上运行<br>关掉启动窗口即退出</div>
      </div>
    </nav>
    <div class="content">
      <div id="status" class="busy" role="status" hidden><span class="spinner" aria-hidden="true"></span><span id="status-text" class="sr-only"></span></div>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <aside id="reader" class="reader" hidden aria-label="阅读面板">
    <div class="reader-head">
      <h2 id="reader-title"></h2>
      <button type="button" id="reader-close" class="btn ghost" aria-label="关闭">✕</button>
    </div>
    <div id="reader-body" class="reader-body"></div>
  </aside>

  <dialog id="dialog">
    <form method="dialog" class="dialog-form">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <div class="dialog-actions">
        <button value="cancel" class="btn ghost">取消</button>
        <button value="ok" id="dialog-ok" class="btn primary">确定</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
